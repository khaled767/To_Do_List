<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>
    <div class="parent">
    <p class=" intro">Things to do</p>
    <div class="search">
        <h3> menu</h3>
        <input type="search" class="search-input" id="search" placeholder="Search">
    </div>
    <div class="todayEvent">
        <h3>today Events</h3>
    </div>
    <div class="addTask">
        <p> add a task</p>
       <div class="form">
            <input type="text" class="title" placeholder="title">
            <small class="error-title" style="color:red"></small>

            <input type="text"  class="desc"  placeholder="Description" >
            <small class="error-desc" style="color:red"></small>

            <input type="date" class="datetime" placeholder="due-date">
            <small class="error-date" style="color:red"></small>
            
            <select name="priority" id="priority">
                <option value="Very-important">Priority 1</option>
                <option value="important">Priority 2</option>
                <option value="Normal">Priority 3</option>
            </select>
            <div class="btnStyle">
            <button type="submit" class="submitbtn">save</button>
            <button type="reset"  class="cancelbtn">cancel</button>
            </div>
        </div>
    </div>
    <div class="error-box"></div>
    <div class="render-task"></div>
    <div class="calendar">
        <div class="header">
            <button id="prevBtn">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            
        <div class="monthYear" id="monthYear"></div>
            <button id="nextBtn">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>
        <div class="days">
            <div class="day">Mon</div>
            <div class="day">Tus</div>
            <div class="day">Wed</div>
            <div class="day">Thu</div>
            <div class="day">Fri</div>
            <div class="day">Sat</div>
            <div class="day">Sun</div>
        </div>
        <div class="dates" id="dates"></div>
    </div>
    </div>
</body>
</html>
