<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Things to do</p>
    <div class="search">
        <h3> menu</h3>
        <input type="text" class="search-input">
    </div>
    <div class="todayEvent">
        <h3>today Events</h3>
    </div>
    <div class="addTask">
        <button id="taskbtn">add task</button>
       <div class="form">
            <input type="text" class="title" placeholder="title">
            <input type="text"  class="desc"  placeholder="Description" >
            <input type="date" class="datetime" placeholder="due-date">
            <select name="priority" id="priority">
                <option value="1">Priority 1</option>
                <option value="2">Priority 2</option>
                <option value="3">Priority 3</option>
            </select>
            <button type="submit" class="submitbtn">save</button>
            <button type="reset"  class="cancelbtn">cancel</button>
        </div>
    </div>
    <div class="calender">
        <h3>Today Events</h3>
        Adding the calender
    </div>
</body>
</html>
