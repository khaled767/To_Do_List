<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
<script defer src="main.js"></script></head>
<body>
    <p>Things to do</p>
    <div class="search">
        <h3> menu</h3>
        <input type="search" class="search-input" placeholder="Search">
    </div>
    <div class="todayEvent">
        <h3>today Events</h3>
    </div>
    <div class="addTask">
        <button id="taskbtn">add task</button>
       <div class="form">
            <input type="text" class="title" placeholder="title">
            <input type="text"  class="desc"  placeholder="Description" >
            <input type="date" class="datetime" placeholder="due-date">
            <select name="priority" id="priority">
                <option value="1">Priority 1</option>
                <option value="2">Priority 2</option>
                <option value="3">Priority 3</option>
            </select>
            <button type="submit" class="submitbtn">save</button>
            <button type="reset"  class="cancelbtn">cancel</button>
        </div>
    </div>
    <div class="error-box"></div>


    <div class="calendar">
        <div class="header">
            <button id="prevBtn">
                <i class="goes to left"></i>
            </button>
            
        <div class="monthYear" id="monthYear"></div>
            <button id="nextBtn">
                <i class="goes-to-right"></i>
            </button>
        </div>
        <div class="days">
            <div class="day">Mon</div>
            <div class="day">Tus</div>
            <div class="day">Wed</div>
            <div class="day">Thu</div>
            <div class="day">Fri</div>
            <div class="day">Sat</div>
            <div class="day">Sun</div>
        </div>
        <div class="dates" id="dates"></div>
    </div>
</body>
</html>
